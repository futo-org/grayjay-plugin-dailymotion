stages:
  - deploy

variables:
  PLUGIN_NAME: Dailymotion
  ICON_FILE: build/DailymotionIcon.png
  SCRIPT_FILE: build/DailymotionScript.js
  CONFIG_FILE: build/DailymotionConfig.json

deploy-master:
  stage: deploy
  variables:
    PRE_RELEASE: "false"
  script:
    - sh deploy.sh
  only:
    - master

deploy-dev:
  stage: deploy
  variables:
    PRE_RELEASE: "true"
  script:
    - sh deploy.sh
  only:
    - dev
